echo "LlmClient.java yazılıyor..."
cat > app/src/main/java/com/aitada/agent/LlmClient.java << 'EOF'
package com.aitada.agent;

import java.io.BufferedReader;
import java.io.InputStreamReader;
import java.io.OutputStream;
import java.net.HttpURLConnection;
import java.net.URL;
import java.nio.charset.StandardCharsets;

import org.json.JSONArray;
import org.json.JSONObject;

public class LlmClient {

    public static String endpoint(String base) {
        String u = base.trim();
        while (u.endsWith("/")) u = u.substring(0, u.length() - 1);
        if (!u.contains("chat/completions")) u = u + "/chat/completions";
        return u;
    }

    public static String complete(Cfg cfg, String system, String user) throws Exception {
        HttpURLConnection c = (HttpURLConnection) new URL(endpoint(cfg.url)).openConnection();
        c.setRequestMethod("POST");
        c.setConnectTimeout(20000);
        c.setReadTimeout(60000);
        c.setDoOutput(true);
        c.setRequestProperty("Content-Type", "application/json");
        c.setRequestProperty("Authorization", "Bearer " + cfg.key);
        JSONObject body = new JSONObject();
        body.put("model", cfg.model);
        body.put("temperature", 0);
        JSONArray msgs = new JSONArray();
        JSONObject m1 = new JSONObject();
        m1.put("role", "system");
        m1.put("content", system);
        msgs.put(m1);
        JSONObject m2 = new JSONObject();
        m2.put("role", "user");
        m2.put("content", user);
        msgs.put(m2);
        body.put("messages", msgs);
        byte[] data = body.toString().getBytes(StandardCharsets.UTF_8);
        OutputStream os = c.getOutputStream();
        os.write(data);
        os.close();
        int code = c.getResponseCode();
        BufferedReader br;
        if (code >= 200 && code < 300) {
            br = new BufferedReader(new InputStreamReader(c.getInputStream(), StandardCharsets.UTF_8));
        } else {
            br = new BufferedReader(new InputStreamReader(c.getErrorStream(), StandardCharsets.UTF_8));
        }
        StringBuilder sb = new StringBuilder();
        String line;
        while ((line = br.readLine()) != null) sb.append(line);
        br.close();
        if (code < 200 || code >= 300) throw new Exception("HTTP " + code + ": " + sb.toString());
        JSONObject res = new JSONObject(sb.toString());
        return res.getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content");
    }

    public static String ping(Cfg cfg) {
        try {
            String r = complete(cfg, "Sen bir test asistanisin.", "Sadece PONG yaz.");
            return "Baglandi: " + r;
        } catch (Exception e) {
            return "Baglanti hatasi: " + e.getMessage();
        }
    }
}
EOF

echo "MainActivity.java yazılıyor..."
cat > app/src/main/java/com/aitada/agent/MainActivity.java << 'EOF'
package com.aitada.agent;

import android.app.Activity;
import android.content.Intent;
import android.content.SharedPreferences;
import android.os.Bundle;
import android.os.Handler;
import android.os.Looper;
import android.provider.Settings;
import android.widget.Button;
import android.widget.EditText;
import android.widget.TextView;
import android.widget.Toast;

public class MainActivity extends Activity {

    private EditText etApiKey;
    private EditText etBaseUrl;
    private EditText etModel;
    private EditText etTask;
    private TextView tvLog;
    private final Handler handler = new Handler(Looper.getMainLooper());

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
        etApiKey = findViewById(R.id.etApiKey);
        etBaseUrl = findViewById(R.id.etBaseUrl);
        etModel = findViewById(R.id.etModel);
        etTask = findViewById(R.id.etTask);
        tvLog = findViewById(R.id.tvLog);
        Button btnConnect = findViewById(R.id.btnConnect);
        Button btnAccessibility = findViewById(R.id.btnAccessibility);
        Button btnStart = findViewById(R.id.btnStart);
        SharedPreferences p = getSharedPreferences("cfg", MODE_PRIVATE);
        etApiKey.setText(p.getString("key", ""));
        etBaseUrl.setText(p.getString("url", "https://api.openai.com/v1"));
        etModel.setText(p.getString("model", "gpt-4o"));
        btnConnect.setOnClickListener(v -> new Thread(() -> {
            saveCfg();
            final String msg = LlmClient.ping(readCfg());
            handler.post(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_LONG).show());
        }).start());
        btnAccessibility.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
        btnStart.setOnClickListener(v -> {
            saveCfg();
            String task = etTask.getText().toString().trim();
            if (task.isEmpty()) {
                Toast.makeText(this, "Lutfen bir gorev yazin", Toast.LENGTH_SHORT).show();
                return;
            }
            if (!AgentAccessibilityService.isRunning()) {
                Toast.makeText(this, "Once erisilebilirlik hizmetini etkinlestirin", Toast.LENGTH_LONG).show();
                startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                return;
            }
            AgentAccessibilityService.startTask(task);
            AgentLog.add("[UI] Gorev servise gonderildi.");
        });
        handler.post(this::refreshLog);
    }

    private void saveCfg() {
        SharedPreferences.Editor e = getSharedPreferences("cfg", MODE_PRIVATE).edit();
        e.putString("key", etApiKey.getText().toString().trim());
        e.putString("url", etBaseUrl.getText().toString().trim());
        e.putString("model", etModel.getText().toString().trim());
        e.apply();
    }

    private Cfg readCfg() {
        SharedPreferences p = getSharedPreferences("cfg", MODE_PRIVATE);
        Cfg c = new Cfg();
        c.key = p.getString("key", "");
        c.url = p.getString("url", "");
        c.model = p.getString("model", "");
        return c;
    }

    private void refreshLog() {
        StringBuilder sb = new StringBuilder();
        for (String s : AgentLog.copy()) {
            sb.append(s).append("\n");
        }
        tvLog.setText(sb.toString());
        handler.postDelayed(this::refreshLog, 600);
    }
}
EOF

