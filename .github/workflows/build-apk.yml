cat > app/src/main/java/com/aitada/agent/AgentAccessibilityService.java << 'EOF'
package com.aitada.agent;

import android.accessibilityservice.AccessibilityService;
import android.accessibilityservice.GestureDescription;
import android.content.Intent;
import android.graphics.Path;
import android.graphics.Rect;
import android.os.Bundle;
import android.view.accessibility.AccessibilityEvent;
import android.view.accessibility.AccessibilityNodeInfo;

import java.util.ArrayList;
import java.util.List;

import org.json.JSONObject;

public class AgentAccessibilityService extends AccessibilityService {

    private static AgentAccessibilityService instance;
    private static volatile String pendingTask = null;
    private volatile boolean running = false;

    public static boolean isRunning() {
        return instance != null;
    }

    public static void startTask(String task) {
        pendingTask = task;
    }

    @Override
    public void onServiceConnected() {
        super.onServiceConnected();
        instance = this;
        running = true;
        Thread worker = new Thread(this::loop, "agent-worker");
        worker.start();
        AgentLog.add("[Servis] Erisilebilirlik hizmeti baglandi.");
    }

    @Override
    public void onAccessibilityEvent(AccessibilityEvent event) {
    }

    @Override
    public void onInterrupt() {
    }

    @Override
    public boolean onUnbind(Intent intent) {
        running = false;
        instance = null;
        return super.onUnbind(intent);
    }

    private void loop() {
        while (running) {
            String task = pendingTask;
            if (task != null) {
                pendingTask = null;
                runTask(task);
            }
            try {
                Thread.sleep(400);
            } catch (InterruptedException e) {
                return;
            }
        }
    }

    private Cfg readCfg() {
        android.content.SharedPreferences p = getSharedPreferences("cfg", MODE_PRIVATE);
        Cfg c = new Cfg();
        c.key = p.getString("key", "");
        c.url = p.getString("url", "");
        c.model = p.getString("model", "");
        return c;
    }

    private void runTask(String task) {
        AgentLog.add("[Gorev] " + task);
        Cfg cfg = readCfg();
        String system = "Sen Android bir telefonu otonom kullanan yapay zeka ajanisin. "
                + "Sana gorev ve ekrandaki ogelerin listesi verilir. "
                + "Her adimda YALNIZCA tek bir JSON nesnesi dondur, baska hicbir sey yazma. "
                + "Gecerli komutlar: "
                + "{\"action\":\"click\",\"x\":123,\"y\":456} | "
                + "{\"action\":\"tap_index\",\"index\":0} | "
                + "{\"action\":\"swipe\",\"x1\":500,\"y1\":1500,\"x2\":500,\"y2\":400} | "
                + "{\"action\":\"type\",\"text\":\"metin\"} | "
                + "{\"action\":\"back\"} | {\"action\":\"home\"} | "
                + "{\"action\":\"launch\",\"package\":\"paket.adi\"} | "
                + "{\"action\":\"wait\"} | {\"action\":\"done\",\"summary\":\"aciklama\"}. "
                + "Bir ogeye dokunmak icin tap_index veya click kullan. "
                + "Gorev tamamlaninca done dondur.";
        
        try {
            String result = LlmClient.complete(cfg, system, "Gorev: " + task);
            AgentLog.add("[Yapay Zeka] " + result);
        } catch (Exception e) {
            AgentLog.add("[Hata] " + e.getMessage());
        }
    }

    private List<ScreenItem> captureScreen() {
        List<ScreenItem> list = new ArrayList<>();
        AccessibilityNodeInfo root = getRootInActiveWindow();
        if (root != null) {
            traverse(root, list);
            root.recycle();
        }
        return list;
    }

    private void traverse(AccessibilityNodeInfo node, List<ScreenItem> list) {
        if (node == null) return;
        if (node.isClickable() || node.isEditable()) {
            Rect rect = new Rect();
            node.getBoundsInScreen(rect);
            if (!rect.isEmpty()) {
                list.add(new ScreenItem(node.getText(), node.getClassName(), rect));
            }
        }
        for (int i = 0; i < node.getChildCount(); i++) {
            traverse(node.getChild(i), list);
        }
    }
}
EOF

